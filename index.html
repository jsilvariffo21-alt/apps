<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
  :root { --bg:#0f2a4a; --ink:#fff; --muted:#b9cce3; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #163a63, var(--bg)); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
  main { width:min(520px,100%); }
  h1 { margin:0 0 4px; font-size:34px; }
  p { color:var(--muted); margin:0 0 20px; }
  a.card { display:flex; gap:16px; align-items:center; background:#fff; color:#13233a; text-decoration:none; border-radius:20px; padding:16px; }
  a.card img { width:72px; height:72px; border-radius:16px; }
  a.card b { font-size:20px; display:block; }
  a.card span { color:#5b6b80; font-size:14.5px; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p>Aplicaciones gratuitas y de código abierto.</p>
  <a class="card" href="moviltrack/">
    <img src="moviltrack/icons/icon-192.png" alt="">
    <div><b>MovilTrack</b><span>Carreras controladas con la mirada para entrenamiento visual.</span></div>
  </a>
</main>
</body>
</html>
